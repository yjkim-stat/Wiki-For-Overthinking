# Where papers and seminars are collected from.
# A topic may narrow these, but never widen them.
#
# The lists below are a deliberately generic starting point. Replace them with
# the categories and venues your own field publishes in — that edit matters
# more than any keyword, because a topic can only ever match what is collected.

arxiv:
  enabled: true
  # HTTPS, not the plain-HTTP endpoint arXiv also serves: sandboxed and
  # proxied environments routinely allow only HTTPS egress.
  api_url: "https://export.arxiv.org/api/query"
  # Default categories. A topic can override with its own `categories` list.
  # Swap in your own: stat.AP, math.ST, econ.EM, q-bio.QM, physics.*, ...
  categories:
    - cs.LG
    - cs.AI
    - stat.ML
    - stat.ME
  # arXiv asks for at least 3 seconds between requests.
  min_request_interval_s: 3.0

  # The listing pages at arxiv.org/list/<category>/recent, as a way in when the
  # API is not available to you. They are a different host from the API, so a
  # policy or rate limit that blocks export.arxiv.org may leave these readable.
  #
  # The listing carries no abstracts, so it can only score titles -- it sees
  # strictly less than the API does. That is why `auto` is the default: use it
  # when the API gave us nothing, not instead of it.
  listing:
    # auto -> only when the API returned nothing | always -> instead of the API
    # never -> off
    mode: auto
    base_url: "https://arxiv.org/list"
    # /recent is a few days of announcements, a few hundred to a few thousand
    # entries. These bound one category's crawl; arXiv asks not to be crawled
    # hard, and scoring titles locally is what keeps this to a few requests.
    page_size: 250
    max_pages: 8
    min_request_interval_s: 5.0
    # One extra request per match, for the abstract the listing omits.
    fetch_abstracts: true
    max_abstracts_per_run: 60

    # The sweep: read every announcement day, record what arXiv says it held,
    # and keep an abstract for every announced paper -- not only the ones a
    # topic currently wants.
    #
    # The point is the per-day count. It is the only number in the pipeline
    # that does not come from our own parsing, so it is the only thing that can
    # tell "nothing was announced" apart from "we failed to read what was".
    # What is short is recorded in data/index/coverage.jsonl as a debt and paid
    # down over later runs, worst day first.
    #
    # Cost, stated plainly: an abstract is one request. A busy category
    # announces a few hundred papers a day, so a full capture takes several
    # runs at the budget below. Abstracts are stored under data/abstracts/ --
    # roughly 1.5 KB each, so a four-category year is on the order of 100 MB
    # before git compresses it.
    #
    # This repository takes the middle option: data/abstracts/ is gitignored
    # and the ledger is not, so the audit survives a fresh clone and the text
    # is re-fetched against it. A deployment that would rather crawl less than
    # carry the weight un-ignores the directory; one that wants neither sets
    # `enabled: false` below and gives up the per-day count.
    sweep:
      enabled: true
      # Abstract fetches per run. Ordered by title relevance, so the group gets
      # what it wants soonest while the tail still drains.
      max_abstracts_per_run: 120

conferences:
  enabled: true
  # Semantic Scholar bulk search: broad venue coverage, no API key required
  # (rate limited without one).
  semantic_scholar:
    enabled: true
    api_url: "https://api.semanticscholar.org/graph/v1/paper/search/bulk"
    # Optional. Read from the SEMANTIC_SCHOLAR_API_KEY env var when set.
    api_key_env: SEMANTIC_SCHOLAR_API_KEY
    # Restrict results to the `venues` list below. Leave false: a preprint's
    # venue is recorded as "arXiv.org", so the filter drops every one of them —
    # including, for a topic whose literature is mostly preprints, all of it.
    # Set true only if your group genuinely reads proceedings versions only.
    restrict_to_venues: false
  # OpenReview covers the review-bearing venues before they hit proceedings.
  #
  # Turned off 2026-08-21. `api2.openreview.net` answered HTTP 403 to every
  # lookup from every run that day -- this machine and the scheduled cloud
  # environment alike, which rules out one host's network policy. A source that
  # fails on every attempt still costs three requests and their retries per run
  # and puts a line in each digest's "Run problems", which is how a genuinely
  # new failure gets lost among the standing ones.
  #
  # Turn it back on to re-test: nothing else has to change, and the venues
  # below keep their `openreview_prefix` so re-enabling is one word. The other
  # two conference collectors (Semantic Scholar, the venues' own programme
  # pages) already cover NeurIPS/ICLR/ICML, so what this loses is early sight
  # of a venue between decisions and proceedings, not the venue itself.
  openreview:
    enabled: false
    api_url: "https://api2.openreview.net/notes"
  # DBLP is the fallback index when the two above miss a venue.
  dblp:
    enabled: true
    api_url: "https://dblp.org/search/publ/api"
  # The venues' own programme pages, e.g. https://icml.cc/virtual/2026/papers.html.
  # Authoritative on what was accepted, and available the day the programme goes
  # up rather than when an index gets round to it. Only venues carrying a
  # `virtual_host` below are fetched.
  virtual_site:
    enabled: true
    # Default sweep, used by any venue that does not pin its own
    # `virtual_years`. The programme page is per year, so this is also how many
    # pages are fetched per venue per run.
    years_back: 2
    # The listing gives titles only. A title is scored first and only papers
    # matching something a topic tracks cost a second request for the abstract
    # and authors. Turning this off keeps the titles and skips the fetches.
    #
    # For scale: one measured ICML programme listed 6,628 accepted papers, of
    # which 153 matched a three-topic deployment. Scoring on the listing is what
    # turns several thousand potential requests into a few dozen — but a busy
    # archive can still exceed the cap below, and what it drops keeps its title
    # and loses only its abstract. The run logs how many.
    fetch_details: true
    max_details_per_run: 60

  # DBLP is bibliographic and carries no abstracts, so a paper only it knows
  # about arrives with nothing but a title — and scoring weights a title hit
  # 3.0 against an abstract hit 1.0, so it is judged on strictly less evidence
  # than the same paper from another index. This fills the gap after
  # collection. Not superseded by `collect.pdfs`: that feeds the reader, this
  # feeds the scorer, and the scorer runs first.
  abstracts:
    enabled: true
    max_lookups: 100
    acl_anthology_url: "https://aclanthology.org"

  # The ACL Anthology's own event pages. One request per venue-year returns the
  # whole programme with abstracts already in it, so a paper is scored on the
  # evidence a reader would have and nothing needs fetching afterwards — the
  # only source here that does that. It applies to any venue carrying an
  # `anthology_key` below, and to no other.
  anthology:
    enabled: true
    base_url: "https://aclanthology.org"
    # Years to read when the caller does not pass a date. A venue may pin its
    # own with `anthology_years`.
    years: [2026, 2025]
    # Which volumes count as the venue. Empty means its own tracks plus
    # Findings -- `acl-long`, `acl-short`, `findings-acl` and so on. An event
    # page also lists every co-located workshop, and a workshop paper is
    # published at the workshop rather than at the conference, so those are
    # opt-in. What is left out is named in the run's log, never dropped
    # silently. Set e.g. ["acl-long", "findings-acl"] to narrow further.
    volumes: []
    # An event page is 4-19 MB and grows each year. This refuses one that has
    # become absurd rather than parsing it.
    max_bytes: 33554432
    min_request_interval_s: 3.0

  # Venues tracked by default. `dblp_key`, `openreview_prefix` and
  # `virtual_host` are used by the matching collector; leave one blank to skip
  # that collector for the venue. `name` is what ends up in the archive, so use
  # the short form your field says out loud.
  #
  # Replace this list with your own. A venue that only Semantic Scholar knows
  # about still works: give it a `name` and leave the keys blank.
  venues:
    - name: NeurIPS
      openreview_prefix: "NeurIPS.cc"
      dblp_key: "NeurIPS"
      virtual_host: "neurips.cc"
      # The venues are not on the same cycle: in the second half of a year
      # NeurIPS's current programme is still the previous year's, so a shared
      # sweep asks it for a page that does not exist. Pin the years that do.
      virtual_years: [2025, 2024]
      # A year whose programme is split across locations lists each one
      # separately. Keyed by year; a year that is absent uses the plain
      # /virtual/<year>/papers.html page.
      virtual_locations:
        "2025": ["san-diego"]
    - name: ICLR
      openreview_prefix: "ICLR.cc"
      dblp_key: "ICLR"
      virtual_host: "iclr.cc"
      virtual_years: [2026, 2025]
    - name: ICML
      openreview_prefix: "ICML.cc"
      dblp_key: "ICML"
      virtual_host: "icml.cc"
      virtual_years: [2026, 2025]
    # ACL has no OpenReview instance and no confs.cc virtual programme. Its
    # primary path is `anthology_key` — the Anthology's own event page, which
    # carries abstracts, so an ACL paper is scored on the same evidence as one
    # from a programme page rather than on its title alone. DBLP stays as the
    # fallback for what the Anthology has not published yet.
    - name: ACL
      openreview_prefix: ""
      dblp_key: "ACL"
      anthology_key: "acl"
    - name: AISTATS
      openreview_prefix: ""
      dblp_key: "AISTATS"
    - name: JMLR
      openreview_prefix: ""
      dblp_key: "J. Mach. Learn. Res."
    # Examples of narrower tracks, commented out. Keep only what your group
    # actually reads — every extra venue is another request per run.
    # - name: CVPR
    #   openreview_prefix: "thecvf.com"
    #   dblp_key: "CVPR"
    # - name: ACL
    #   openreview_prefix: ""
    #   dblp_key: "ACL"
    # - name: KDD
    #   openreview_prefix: ""
    #   dblp_key: "KDD"
    # - name: "Journal of the American Statistical Association"
    #   openreview_prefix: ""
    #   dblp_key: ""

curated:
  # Weekly editor's picks: somebody reads a field's whole output and publishes
  # the handful worth reading. That filter is judgement applied before any
  # keyword sees the paper, which is exactly what a keyword cannot do.
  #
  # A list is read for POINTERS ONLY. Entries name a paper the way people say
  # it out loud -- an acronym plus a paragraph of commentary -- so the title,
  # authors and abstract are fetched from the arXiv id the entry links to. An
  # entry linking to a blog post or a journal page has no bibliography to read
  # and is skipped BY NAME in the log; file it through `inbox/` if you want it.
  #
  # Picks are scored like anything else. A hand-filed PDF skips scoring because
  # filing it is the group's own editorial decision; a curated list is somebody
  # else's, taken over a whole field rather than over your topics. Expect most
  # of a general list to be rejected against a narrow archive -- that is the
  # filter working, not failing.
  enabled: true
  # Issues to read per list, newest first. Weekly lists, so 4 is about a month:
  # enough that a few missed runs lose nothing. Raise it to backfill.
  max_issues: 4
  # The link label that means "the paper itself". The commentary in an issue
  # often names other work in passing, and following that would archive what
  # the editor mentioned rather than what they picked. A list that uses no such
  # label falls back to any arXiv link in the issue.
  link_label: "Paper"
  min_request_interval_s: 1.0
  lists:
    # The markdown mirror of DAIR.AI's weekly list. The LinkedIn and Substack
    # editions are the same papers behind a login wall; this one is fetchable.
    # The file is an index of issues, each linking into a per-year page.
    - name: "DAIR.AI ML Papers of the Week"
      url: "https://raw.githubusercontent.com/dair-ai/ML-Papers-of-the-Week/main/README.md"
    # A single-page list works too: with no per-issue index, the page itself is
    # read as one issue.
    # - name: "Some Awesome List"
    #   url: "https://raw.githubusercontent.com/user/repo/main/README.md"

local:
  # PDFs filed by hand. Drop a file into the inbox and the next run ingests it:
  # the file moves to `data/pdfs/` under a content-addressed name, and a task is
  # queued asking whoever drains the queue to read the document and supply the
  # bibliography. A hand-filed PDF is never rejected by keyword scoring.
  enabled: true
  # Relative to the repository root. Also settable as `paths.inbox` in
  # settings.yaml; this flag only decides whether the folder is looked at.

youtube:
  enabled: true
  # Channel RSS needs no API key. Add channels as {name, channel_id}.
  # Find a channel_id from the channel page source (`"channelId":"UC..."`).
  feed_url: "https://www.youtube.com/feeds/videos.xml"
  channels: []
  # Example — a department seminar series, a summer school, a conference's
  # recorded talks:
  # channels:
  #   - name: "Example Research Seminar"
  #     channel_id: "UCxxxxxxxxxxxxxxxxxxxxxx"

  # Transcripts need the optional `youtube-transcript-api` package. Without
  # it, videos are still archived and flagged as transcript-less.
  fetch_transcripts: true
  # Skip anything shorter than this: shorts and teasers are not seminars.
  min_duration_s: 600

# ---------------------------------------------------------------------------
# GitHub — candidates for a *reference*, never for the archive.
#
# A repository cannot become a paper here. `Concept.evidence` counts papers and
# talks the archive has read, and that count is what promotes an entity to a
# note of its own; if a repository could contribute to it, nothing afterwards
# could say what the wiki grew from. What a repository can be is a reference —
# a published implementation, cited by a finding.
#
# Collection therefore fills `candidates/pending/` and writes no record. A
# session reads one and runs `candidates promote --quoted "..."`, because the
# quotation is the passage somebody actually relied on and no collector can
# supply it. See pipelines/candidates.py.
github:
  enabled: true
  # Anonymous search is 10 requests/minute; one query per topic is well inside
  # it. There is no token here on purpose — an unauthenticated collector cannot
  # act on behalf of anybody.
  min_interval_s: 6.0
  # A repository nobody has touched in a month is not what a daily sweep is for.
  pushed_within_days: 30
  # Below this, the signal is mostly name collisions with the search terms.
  min_stars: 25
  per_topic_results: 15
  # The cap bounds a run, not a decision: what is dropped here is offered again
  # tomorrow, and only `candidates drop` is permanent.
  max_candidates_per_run: 20
