# Where papers and seminars are collected from.
# A topic may narrow these, but never widen them.
#
# The lists below are a deliberately generic starting point. Replace them with
# the categories and venues your own field publishes in — that edit matters
# more than any keyword, because a topic can only ever match what is collected.

arxiv:
  enabled: true
  # HTTPS, not the plain-HTTP endpoint arXiv also serves: sandboxed and
  # proxied environments routinely allow only HTTPS egress.
  api_url: "https://export.arxiv.org/api/query"
  # Default categories. A topic can override with its own `categories` list.
  # Swap in your own: stat.AP, math.ST, econ.EM, q-bio.QM, physics.*, ...
  categories:
    # LOCAL: this archive is about language-model reasoning, so cs.CL leads and
    # the statistics categories are dropped. See docs/LOCAL-DELTAS.md.
    - cs.CL
    - cs.LG
    - cs.AI
    - stat.ML
  # arXiv asks for at least 3 seconds between requests.
  min_request_interval_s: 3.0

  # The listing pages at arxiv.org/list/<category>/recent, as a way in when the
  # API is not available to you. They are a different host from the API, so a
  # policy or rate limit that blocks export.arxiv.org may leave these readable.
  #
  # The listing carries no abstracts, so it can only score titles -- it sees
  # strictly less than the API does. That is why `auto` is the default: use it
  # when the API gave us nothing, not instead of it.
  listing:
    # auto -> only when the API returned nothing | always -> instead of the API
    # never -> off
    mode: auto
    base_url: "https://arxiv.org/list"
    # /recent is a few days of announcements, a few hundred to a few thousand
    # entries. These bound one category's crawl; arXiv asks not to be crawled
    # hard, and scoring titles locally is what keeps this to a few requests.
    page_size: 250
    max_pages: 8
    min_request_interval_s: 5.0
    # One extra request per match, for the abstract the listing omits.
    fetch_abstracts: true
    max_abstracts_per_run: 60

    # The sweep: read every announcement day, record what arXiv says it held,
    # and keep an abstract for every announced paper -- not only the ones a
    # topic currently wants.
    #
    # The point is the per-day count. It is the only number in the pipeline
    # that does not come from our own parsing, so it is the only thing that can
    # tell "nothing was announced" apart from "we failed to read what was".
    # What is short is recorded in data/index/coverage.jsonl as a debt and paid
    # down over later runs, worst day first.
    #
    # Cost, stated plainly: an abstract is one request. A busy category
    # announces a few hundred papers a day, so a full capture takes several
    # runs at the budget below. Abstracts are stored under data/abstracts/ --
    # roughly 1.5 KB each, so a four-category year is on the order of 100 MB
    # before git compresses it.
    #
    # This repository takes the middle option: data/abstracts/ is gitignored
    # and the ledger is not, so the audit survives a fresh clone and the text
    # is re-fetched against it. A deployment that would rather crawl less than
    # carry the weight un-ignores the directory; one that wants neither sets
    # `enabled: false` below and gives up the per-day count.
    sweep:
      enabled: true
      # Abstract fetches per run. Ordered by title relevance, so the group gets
      # what it wants soonest while the tail still drains.
      max_abstracts_per_run: 120

conferences:
  enabled: true
  # Semantic Scholar bulk search: broad venue coverage, no API key required
  # (rate limited without one).
  semantic_scholar:
    enabled: true
    api_url: "https://api.semanticscholar.org/graph/v1/paper/search/bulk"
    # Optional. Read from the SEMANTIC_SCHOLAR_API_KEY env var when set.
    api_key_env: SEMANTIC_SCHOLAR_API_KEY
    # Restrict results to the `venues` list below. Leave false: a preprint's
    # venue is recorded as "arXiv.org", so the filter drops every one of them —
    # including, for a topic whose literature is mostly preprints, all of it.
    # Set true only if your group genuinely reads proceedings versions only.
    restrict_to_venues: false
  # OpenReview covers the review-bearing venues before they hit proceedings.
  openreview:
    # LOCAL: the API answers anonymous clients with HTTP 403
    # `ChallengeRequiredError`, so every request fails and each failure costs
    # the run its retry budget. See docs/commit-local/0016-turn-off-openreview.md.
    enabled: false
    api_url: "https://api2.openreview.net/notes"
  # DBLP is the fallback index when the two above miss a venue.
  dblp:
    enabled: true
    api_url: "https://dblp.org/search/publ/api"
  # The venues' own programme pages, e.g. https://icml.cc/virtual/2026/papers.html.
  # Authoritative on what was accepted, and available the day the programme goes
  # up rather than when an index gets round to it. Only venues carrying a
  # `virtual_host` below are fetched.
  virtual_site:
    enabled: true
    # Default sweep, used by any venue that does not pin its own
    # `virtual_years`. The programme page is per year, so this is also how many
    # pages are fetched per venue per run.
    years_back: 2
    # The listing gives titles only. A title is scored first and only papers
    # matching something a topic tracks cost a second request for the abstract
    # and authors. Turning this off keeps the titles and skips the fetches.
    #
    # For scale: one measured ICML programme listed 6,628 accepted papers, of
    # which 153 matched a three-topic deployment. Scoring on the listing is what
    # turns several thousand potential requests into a few dozen — but a busy
    # archive can still exceed the cap below, and what it drops keeps its title
    # and loses only its abstract. The run logs how many.
    fetch_details: true
    max_details_per_run: 60

  # LOCAL: DBLP is bibliographic and carries no abstracts, so a paper only it
  # knows about arrives with nothing but a title — and scoring weights a title
  # hit 3.0 against an abstract hit 1.0, so it is judged on strictly less
  # evidence than the same paper from another index. This fills the gap after
  # collection. Not superseded by pdf_fetch: that feeds the reader, this feeds
  # the scorer, and the scorer runs first.
  # See docs/commit-local/0023-a-title-is-not-enough-to-score-a-paper.md.
  abstracts:
    enabled: true
    max_lookups: 100
    acl_anthology_url: "https://aclanthology.org"

  # Venues tracked by default. `dblp_key`, `openreview_prefix` and
  # `virtual_host` are used by the matching collector; leave one blank to skip
  # that collector for the venue. `name` is what ends up in the archive, so use
  # the short form your field says out loud.
  #
  # Replace this list with your own. A venue that only Semantic Scholar knows
  # about still works: give it a `name` and leave the keys blank.
  venues:
    # LOCAL: the venues this group tracks. See docs/LOCAL-DELTAS.md.
    - name: NeurIPS
      openreview_prefix: "NeurIPS.cc"
      dblp_key: "NeurIPS"
      virtual_host: "neurips.cc"
      # The venues are not on the same cycle: in the second half of a year
      # NeurIPS's current programme is still the previous year's.
      virtual_years: [2025, 2024]
      virtual_locations:
        "2025": ["san-diego"]
    - name: ICLR
      openreview_prefix: "ICLR.cc"
      dblp_key: "ICLR"
      virtual_host: "iclr.cc"
      virtual_years: [2026, 2025]
    - name: ICML
      openreview_prefix: "ICML.cc"
      dblp_key: "ICML"
      virtual_host: "icml.cc"
      virtual_years: [2026, 2025]
    - name: ACL
      openreview_prefix: ""
      dblp_key: "ACL"
    - name: EMNLP
      openreview_prefix: ""
      dblp_key: "EMNLP"
    - name: NAACL
      openreview_prefix: ""
      dblp_key: "NAACL"
    - name: COLM
      openreview_prefix: "colmweb.org"
      dblp_key: ""


youtube:
  enabled: true
  # Channel RSS needs no API key. Add channels as {name, channel_id}.
  # Find a channel_id from the channel page source (`"channelId":"UC..."`).
  feed_url: "https://www.youtube.com/feeds/videos.xml"
  channels: []
  # Example — a department seminar series, a summer school, a conference's
  # recorded talks:
  # channels:
  #   - name: "Example Research Seminar"
  #     channel_id: "UCxxxxxxxxxxxxxxxxxxxxxx"

  # Transcripts need the optional `youtube-transcript-api` package. Without
  # it, videos are still archived and flagged as transcript-less.
  fetch_transcripts: true
  # Skip anything shorter than this: shorts and teasers are not seminars.
  min_duration_s: 600
