# How reasoning is measured, and whether the measurement means anything.

slug: reasoning-evaluation
name: Reasoning Evaluation

description: >-
  Benchmarks for reasoning and the methodology behind them: what each one
  actually tests, how contamination and memorization inflate a score, and where
  a reported gain fails to reproduce. The question the archive answers is which
  numbers a claim about reasoning can be built on.

keywords:
  any:
    - reasoning benchmark
    - mathematical reasoning
    - multi-step reasoning
    - logical reasoning
    - competition math
    - math word problem
    - GSM8K
    - AIME
    - benchmark contamination
    - data contamination
    - LLM as a judge
    - reasoning evaluation
    - evaluating reasoning
    - ARC AGI
  all: []
  none: []

