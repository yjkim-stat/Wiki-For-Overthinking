<svg class="fig" viewBox="0 0 1432 330" role="img"
             aria-label="학습 시점 스케일링과 추론 시점 스케일링의 대비, 그리고 이 발표가 묻는 질문">
          <rect x="0" y="10" width="640" height="180" rx="16" fill="#F5F6F9" stroke="#E4E8EE" stroke-width="1.5"/>
          <text x="30" y="56" font-size="21" font-weight="800" fill="#6E7885">학습 시점 스케일링</text>
          <text x="30" y="98" font-size="19" fill="#6B7484">파라미터와 데이터를 키운다</text>
          <text x="30" y="140" font-size="19" fill="#9AA3B0">비용이 학습에 한 번 든다</text>
          <text x="30" y="170" font-size="19" fill="#9AA3B0">답의 길이는 그대로</text>

          <text x="686" y="108" text-anchor="middle" font-size="30" fill="#AEB6C1">→</text>

          <rect x="740" y="10" width="692" height="180" rx="16" fill="#EEF3FA" stroke="#D3E0EF" stroke-width="1.5"/>
          <text x="770" y="56" font-size="21" font-weight="800" fill="#5E88BC">추론 시점 스케일링</text>
          <text x="770" y="98" font-size="19" fill="#6B7484">추론 토큰 생성량 증대</text>
          <text x="770" y="140" font-size="19" fill="#384150">비용이 <tspan font-weight="700">질의를 던질 때마다</tspan> 든다</text>
          <text x="770" y="170" font-size="19" fill="#384150">답의 길이가 <tspan font-weight="700">성능을 여는 손잡이</tspan>가 된다</text>

          <rect x="0" y="212" width="1432" height="106" rx="14" fill="#EDF5F1" stroke="#CCE3D8" stroke-width="1.5"/>
          <text x="30" y="252" font-size="20" fill="#384150">선행 연구의 관찰: 추론 토큰을 늘리면 <tspan font-weight="700" fill="#5C9A7C">일반적으로 성능·견고성 향상</tspan> — 파라미터 확대보다 우위 가능 <tspan font-size="17" fill="#9AA3B0">(Snell 외, 2024)</tspan></text>
          <text x="30" y="290" font-size="20" fill="#384150">이 발표의 질문: <tspan font-weight="800" fill="#C4788A">그 곡선은 어디까지 오르나.</tspan> 그리고 그 지점을 넘기면 어떻게 되나.</text>
          <text x="30" y="312" font-size="15" fill="#9AA3B0">위 정리와 인용 목록은 Gema 외(2025) 서론을 따랐다. o1·R1·Snell 원문은 아카이브가 보유하지 않는다.</text>
        </svg>
