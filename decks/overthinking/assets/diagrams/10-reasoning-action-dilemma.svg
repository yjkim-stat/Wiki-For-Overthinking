<svg class="fig" viewBox="0 0 700 330" role="img"
               aria-label="오버씽킹 점수는 0에서 10까지이며, 0에서 3은 환경과 적절히 상호작용, 4에서 7은 내부 추론에 과의존, 8에서 10은 환경에서 완전히 이탈을 뜻한다. 세 패턴은 계획만 하기, 피드백을 기다리지 않기, 검증 없이 종료하기다.">
            <text x="0" y="18" font-size="16" font-weight="800" fill="#C4788A" letter-spacing="0.04em">오버씽킹 점수란</text>
            <rect x="0"   y="40" width="210" height="40" rx="6" fill="#CCE3D8"/>
            <rect x="212" y="40" width="278" height="40" rx="6" fill="#EEDFC0"/>
            <rect x="492" y="40" width="208" height="40" rx="6" fill="#EFD5DC"/>
            <text x="105" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#3F7259">환경과 상호작용</text>
            <text x="351" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#96702C">내부 추론에 과의존</text>
            <text x="596" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#A65B70">환경에서 완전 이탈</text>
            <text x="0"   y="102" font-size="15" fill="#9AA3B0">0</text>
            <text x="210" y="102" text-anchor="middle" font-size="15" fill="#9AA3B0">3</text>
            <text x="490" y="102" text-anchor="middle" font-size="15" fill="#9AA3B0">7</text>
            <text x="700" y="102" text-anchor="end" font-size="15" fill="#9AA3B0">10</text>

            <text x="0" y="152" font-size="16" font-weight="800" fill="#C4788A" letter-spacing="0.04em">점수를 올리는 세 패턴</text>
            <circle cx="8" cy="184" r="5" fill="#C4788A"/>
            <text x="26" y="190" font-size="18" fill="#384150">행동 대신 <tspan font-weight="700">계획만 지속</tspan></text>
            <circle cx="8" cy="228" r="5" fill="#C4788A"/>
            <text x="26" y="234" font-size="18" fill="#384150">피드백을 <tspan font-weight="700">대기 없이</tspan> 여러 행동을 낸다</text>
            <circle cx="8" cy="272" r="5" fill="#C4788A"/>
            <text x="26" y="278" font-size="18" fill="#384150">환경 검증 <tspan font-weight="700">없이 종료</tspan></text>
            <text x="0" y="318" font-size="15" fill="#9AA3B0">채점 시 궤적에서 성공·실패 정보 제거.</text>
          </svg>
