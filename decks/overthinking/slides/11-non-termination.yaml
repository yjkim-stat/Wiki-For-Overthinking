              <span class="k-rose">다만 인과 아님</span> — 강제 조기 종료 시 정답 여부는 미실험. 논문의 표현은 “수렴과 정답이 <span class="em">거의 함께 간다</span>”까지
            n_style: font-size:18px;
            style: padding:14px 18px;
        - card:
            color: plain
