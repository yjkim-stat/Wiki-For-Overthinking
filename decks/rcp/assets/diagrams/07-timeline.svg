<svg viewBox="0 0 1432 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Measurement 2025, Convergence 2026, Branching 2026, Replication 2026 H2로 이어지는 타임라인">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9AA3B0"/>
    </marker>
    <marker id="arw-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#C4788A"/>
    </marker>
  </defs>

  <!-- the spine -->
  <line x1="64" y1="132" x2="1368" y2="132" stroke="#E4E8EE" stroke-width="3" marker-end="url(#arw)"/>

  <!-- ── Measurement ──────────────────────────────────────────────── -->
  <circle cx="180" cy="132" r="13" fill="#9AA3B0"/>
  <text x="180" y="86" text-anchor="middle" font-size="20" font-weight="700" fill="#9AA3B0" letter-spacing="1.5">2025</text>
  <text x="180" y="182" text-anchor="middle" font-size="25" font-weight="800" fill="#384150">Measurement</text>
  <text x="180" y="214" text-anchor="middle" font-size="18" fill="#6B7484">forced-answer probing</text>
  <text x="180" y="240" text-anchor="middle" font-size="18" fill="#6B7484">shallow signals · hard items</text>

  <!-- ── Convergence ──────────────────────────────────────────────── -->
  <circle cx="565" cy="132" r="13" fill="#767F8D"/>
  <text x="565" y="86" text-anchor="middle" font-size="20" font-weight="700" fill="#767F8D" letter-spacing="1.5">2026</text>
  <text x="565" y="182" text-anchor="middle" font-size="25" font-weight="800" fill="#384150">Convergence</text>
  <text x="565" y="214" text-anchor="middle" font-size="18" fill="#6B7484">RCP · end-token rank</text>
  <text x="565" y="240" text-anchor="middle" font-size="18" fill="#6B7484">three works, same token</text>

  <!-- ── Branching ────────────────────────────────────────────────── -->
  <circle cx="950" cy="132" r="13" fill="#4A5361"/>
  <text x="950" y="86" text-anchor="middle" font-size="20" font-weight="700" fill="#4A5361" letter-spacing="1.5">2026</text>
  <text x="950" y="182" text-anchor="middle" font-size="25" font-weight="800" fill="#384150">Branching</text>
  <text x="950" y="214" text-anchor="middle" font-size="18" fill="#6B7484">semantic redundancy</text>
  <text x="950" y="240" text-anchor="middle" font-size="18" fill="#6B7484">reflection · learned probes</text>

  <!-- ── Replication ──────────────────────────────────────────────── -->
  <circle cx="1300" cy="132" r="13" fill="#C4788A"/>
  <text x="1300" y="86" text-anchor="middle" font-size="20" font-weight="700" fill="#C4788A" letter-spacing="1.5">2026 H2</text>
  <text x="1300" y="182" text-anchor="middle" font-size="25" font-weight="800" fill="#384150">Replication</text>
  <text x="1300" y="214" text-anchor="middle" font-size="18" fill="#6B7484">self-report vs.</text>
  <text x="1300" y="240" text-anchor="middle" font-size="18" fill="#6B7484">external reproduction</text>

  <!-- 마지막 마디가 앞의 주장으로 되돌아간다는 것을 곡선으로 -->
  <path d="M1300 112 C 1300 54, 760 44, 572 58" fill="none" stroke="#C4788A"
        stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arw-rose)" opacity="0.75"/>
  <text x="930" y="26" text-anchor="middle" font-size="17" fill="#C4788A">re-tests the 2026 claims</text>
</svg>
