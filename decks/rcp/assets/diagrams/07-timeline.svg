<svg viewBox="0 0 1432 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="2025년 도구 확정에서 2026년 신호 수렴, 가지 분화, 외부 재현으로 이어지는 흐름">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9AA3B0"/>
    </marker>
    <marker id="arw-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#C4788A"/>
    </marker>
  </defs>

  <!-- the spine -->
  <line x1="64" y1="132" x2="1368" y2="132" stroke="#E4E8EE" stroke-width="3" marker-end="url(#arw)"/>

  <!-- ── 2025 · 도구 ───────────────────────────────────────────────── -->
  <circle cx="180" cy="132" r="13" fill="#9AA3B0"/>
  <text x="180" y="86" text-anchor="middle" font-size="21" font-weight="800" fill="#9AA3B0" letter-spacing="1.5">2025</text>
  <text x="180" y="182" text-anchor="middle" font-size="24" font-weight="800" fill="#384150">도구가 만들어지다</text>
  <text x="180" y="214" text-anchor="middle" font-size="18" fill="#6B7484">중간에 끊어 답을 뽑는 계측</text>
  <text x="180" y="240" text-anchor="middle" font-size="18" fill="#6B7484">얕은 신호는 어려운 문항에서 무너진다</text>

  <!-- ── 2026 · 수렴 ───────────────────────────────────────────────── -->
  <circle cx="565" cy="132" r="13" fill="#767F8D"/>
  <text x="565" y="86" text-anchor="middle" font-size="21" font-weight="800" fill="#767F8D" letter-spacing="1.5">2026</text>
  <text x="565" y="182" text-anchor="middle" font-size="24" font-weight="800" fill="#384150">같은 신호에 도달하다</text>
  <text x="565" y="214" text-anchor="middle" font-size="18" fill="#6B7484">RCP가 수렴을 정의하고,</text>
  <text x="565" y="240" text-anchor="middle" font-size="18" fill="#6B7484">세 연구가 독립적으로 같은 토큰에 닿는다</text>

  <!-- ── 가지 ─────────────────────────────────────────────────────── -->
  <circle cx="950" cy="132" r="13" fill="#4A5361"/>
  <text x="950" y="86" text-anchor="middle" font-size="21" font-weight="800" fill="#4A5361" letter-spacing="1.5">가지</text>
  <text x="950" y="182" text-anchor="middle" font-size="24" font-weight="800" fill="#384150">다르게 푸는 갈래</text>
  <text x="950" y="214" text-anchor="middle" font-size="18" fill="#6B7484">의미적 잉여 · 반성 억제</text>
  <text x="950" y="240" text-anchor="middle" font-size="18" fill="#6B7484">학습된 프로브</text>

  <!-- ── 검증 ─────────────────────────────────────────────────────── -->
  <circle cx="1300" cy="132" r="13" fill="#C4788A"/>
  <text x="1300" y="86" text-anchor="middle" font-size="21" font-weight="800" fill="#C4788A" letter-spacing="1.5">검증</text>
  <text x="1300" y="182" text-anchor="middle" font-size="24" font-weight="800" fill="#384150">되돌아온 재현</text>
  <text x="1300" y="214" text-anchor="middle" font-size="18" fill="#6B7484">자기보고가 밖에서</text>
  <text x="1300" y="240" text-anchor="middle" font-size="18" fill="#6B7484">재현되지 않는다</text>

  <!-- 검증이 앞의 주장으로 되돌아간다는 것을 곡선으로 -->
  <path d="M1300 104 C 1300 52, 760 44, 572 58" fill="none" stroke="#C4788A"
        stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arw-rose)" opacity="0.75"/>
  <text x="930" y="26" text-anchor="middle" font-size="17" fill="#C4788A">2026년의 주장을 다시 시험한다</text>
</svg>
