# What the whole deck is. Per-slide content lives in slides/;
# the bibliography lives in references.yaml.

title: 언제 멈출 것인가 — RCP와 그 계보
lang: ko
theme: ../theme
fonts: |-
  https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap
hint:
- ← →
- ·
- 클릭
- ·
- F 전체화면

# Named styles. A block's `style:` may give one or more of these names instead
# of CSS, so a look that several slides share is written down once. Anything
# containing a colon is treated as literal CSS and passed straight through.
styles:
  fill:        flex:1;min-height:0;
  column:      display:flex;flex-direction:column;
  name:        font-size:21px;margin-bottom:12px;
  sig:         font-size:15px;margin-top:12px;color:var(--ink-mid);
  claim:       font-size:15px;color:var(--ink);margin-top:6px;line-height:1.45;
  cost:        font-size:15px;color:var(--rose);font-weight:600;margin-top:6px;line-height:1.4;
  papers:      font-size:13px;margin-top:auto;padding-top:10px;color:var(--ink-mid);line-height:1.5;
  year:        font-size:13px;letter-spacing:0.08em;color:var(--ink-mid);margin-bottom:4px;
  formula:     font-size:19px;text-align:center;margin:14px 0;line-height:1.7;
  quiet:       font-size:15px;color:var(--ink-mid);line-height:1.55;
  # Figure placeholder — a dashed box holding the crop that will replace it.
  # Remove the style and swap the box for a `figure:` block once the crop is
  # in assets/figures/. See assets/FIGURES.md in the overthinking deck.
  # A slide must stand on its own: every metric it shows is defined, and the
  # conditions the number was produced under are named, in small grey type
  # directly under the table or figure that carries it.
  fn:          font-size:13.5px;color:var(--ink-soft);line-height:1.6;text-align:left;margin-top:10px;
  cap:         font-size:13.5px;color:var(--ink-soft);line-height:1.6;
  ph:          border:2px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:rgba(0,0,0,0.015);flex:1;min-height:150px;margin:12px 0;
  ph-title:    font-size:17px;font-weight:700;color:var(--ink-mid);
  ph-src:      font-size:13px;color:var(--ink-mid);opacity:0.8;
