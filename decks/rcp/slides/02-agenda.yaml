# 02 — Agenda
layout: content
eyebrow: Agenda
title: 네 개의 시기
blocks:
- lead: 같은 질문이 네 번 다시 물어진다 — <span class="em">모델은 언제 답을 다 만들었는가.</span>
- cards:
    cols: 4
    style: fill
    items:
    - color: blue
      k: 2025
      t: 도구가 만들어지다
      t_style: name
      bullets:
      - 절단해서 답을 뽑는 계측
      - ACR · 단일 confidence · 고정 예산
      - 압축의 이론적 하한
      bullet_size: sm
      style: column
    - color: green
      k: 2026
      t: 같은 신호에 도달하다
      t_style: name
      bullets:
      - RCP가 수렴을 정의한다
      - 셋이 독립적으로 <span class="mono">&lt;/think&gt;</span>에 닿는다
      - 신호는 있는데 따라지지 않는다
      bullet_size: sm
      style: column
    - color: amber
      k: 갈래
      t: 다르게 푸는 가지들
      t_style: name
      bullets:
      - 의미적 잉여 · 반성 억제
      - 학습된 프로브 · 훈련 내재화
      - 신호 사다리로 정리
      bullet_size: sm
      style: column
    - color: rose
      k: 검증
      t: 되돌아온 재현
      t_style: name
      bullets:
      - 자기보고가 재현되지 않는다
      - 아무도 안 잰 것
      - 하한이 판을 축소시킨다
      bullet_size: sm
      style: column
- note: 모든 수치는 아카이브가 원문 PDF로 읽은 기록에서 인용했다. 재현 결과와 자기보고가 어긋나는 경우 양쪽을 모두 적는다.
foot: Agenda
