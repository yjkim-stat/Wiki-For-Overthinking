title: 답 이후 생성분이 41–52%
blocks:
- lead: 다섯 모델 전부에서 <span class="em">추론 토큰의 40% 이상</span>이 답이 나온 뒤에 생성된다.
- figure:
    src: puma-after-answer.png
    alt: 다섯 모델에서 최종 답 도달 전후의 토큰 분해
    caption: |-
      Min 외 (2026) Figure 5a 원문. 막대 하나가 모델 하나 · <b>파랑</b>은 최종 답이 나오기까지 쓴 토큰, <b>빗금 친 분홍</b>은 그 뒤에 생성된 토큰 · 막대 위 숫자가 후자의 비율. 초록 마름모는 PUMA<span class="ref">(38장)</span>가 실제로 멈춘 지점, 주황 점선은 이론적 최적 지점.
    caption_style: cap
- caption:
    text: |-
      * 세로축은 <b>문항당 평균 토큰</b>이다. DeepSeek-7B 45% · DeepSeek-14B 41% · DeepSeek-32B 44% · Nemotron-8B 42% · Qwen3-30B 52%.<br>
      * 다른 두 논문이 같은 방향의 수치를 낸다 — 매 문장 경계에서 잘라보고 <b>사후에</b> 최적 지점을 고르면 AIME 오답의 61%가 회복되면서 토큰이 44% 줄고<span class="ref">Song 외 (2026)</span>, 정답 trace가 평균 약 12K 토큰인 데 비해 오답 trace는 25K를 넘는다<span class="ref">Hosseini 외 (2026) · Qwen3-4B · AIME24·25</span>.
