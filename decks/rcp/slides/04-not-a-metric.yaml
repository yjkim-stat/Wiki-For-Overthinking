# 04 — 길다는 것은 측정이 아니다
layout: content
eyebrow: 무엇이 문제인가
eyebrow_color: rose
title: “너무 길다”는 아직 측정이 아니다
blocks:
- lead: 낭비라고 말하려면 <span class="em">더 짧아도 됐다</span>는 것을 알아야 한다. 한 번 돌린 trace 안에는 그 정보가 없다.
- cards:
    cols: 2
    style: fill
    items:
    - color: plain
      t: 길이만 보면 알 수 없는 것
      t_style: name
      bullets:
      - 긴 trace가 <span class="em">어려운 문항</span>이어서 긴 것인지
      - 아니면 <span class="em">쉬운 문항</span>인데 낭비한 것인지
      bullet_size: sm
      n:
      - 실제로 오답 궤적이 정답 궤적보다 길다 — 길이는 난이도의 신호이기도 하다
      n_style: [claim]
      style: column
    - color: green
      t: 그래서 필요한 것
      t_style: name
      bullets:
      - <span class="em">답이 언제 확정됐는지</span>를 따로 관측할 수단
      - 그 시점과 실제 정지 시점을 <span class="em">같은 축 위에서</span> 비교할 것
      bullet_size: sm
      style: column
foot: 무엇이 문제인가
