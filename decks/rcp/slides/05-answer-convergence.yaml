      t: 프로토콜
      t_style: name
      bullets:
      - CoT를 <span class="em">NLTK 문장 청크</span>로 자른다
      - 접두사를 하나씩 늘려가며 <span class="mono">&lt;/think&gt;</span>를 강제 주입
      - 각 지점에서 greedy로 답을 뽑는다
      - 답이 더 이상 안 바뀌는 최초 지점을 찾는다
      bullet_size: sm
      n:
      - 정답 라벨이 필요 없다 — 기준은 <span class="em">모델 자신의 최종 예측</span>
