# 05b — 네 가지 결정
layout: content
eyebrow: Framing
eyebrow_color: violet
title: 모든 방법이 답해야 하는 네 가지
body_height: 470px
blocks:
- lead: 이후 나올 열두 개의 방법은 전부 <span class="em">같은 네 질문에 서로 다르게 답한 것</span>이다.
- cards:
    cols: 2
    style: fill
    items:
    - color: blue
      k: ①
      t: 무엇을 읽나
      t_style: name
      bullets:
      - 출력 문자열 · 답 확신도 · 종료 토큰 · 추론 의미 · 내부 활성값 · <span class="em">안 읽음</span> (예산)
      bullet_size: sm
      style: column
    - color: green
      k: ②
      t: 언제 판정
      t_style: name
      bullets:
      - <span class="em">한 지점</span>만 보는가, 여러 지점을 <span class="em">모아서</span> 보는가
      bullet_size: sm
      style: column
    - color: amber
      k: ③
      t: 기준 출처
      t_style: name
      bullets:
      - 손으로 고정 · 이론에서 유도 · 데이터로 학습 · 돌려가며 적응
      bullet_size: sm
      style: column
    - color: rose
      k: ④
      t: 비용
      t_style: name
      bullets:
      - 추론 토큰만 · 추가 비용까지 · 실제 소요 시간
      bullet_size: sm
      style: column
- caption:
    text: |-
      * 같은 신호를 읽어도 ②③④에서 갈린다. 이 발표는 다섯 번째를 덧붙인다 — <b>그 판정이 맞는지 확인했는가</b><span class="ref">(49장, 그 열은 거의 비어 있다)</span>.
    style: fn
foot: Framing
