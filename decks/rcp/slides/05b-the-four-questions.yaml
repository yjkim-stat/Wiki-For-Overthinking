# 05b — 네 가지 결정
layout: content
eyebrow: 이 발표의 축
eyebrow_color: violet
title: 모든 방법이 답해야 하는 네 가지
blocks:
- lead: 이후 나올 열 몇 개의 방법은 전부 <span class="em">같은 네 질문에 서로 다르게 답한 것</span>이다. 이 축으로 보면 무엇이 새롭고 무엇이 반복인지가 드러난다.
- cards:
    cols: 4
    style: fill
    items:
    - color: blue
      k: ①
      t: 무엇을 읽는가
      t_style: name
      bullets:
      - 멈출 때가 됐다는 것을 <span class="em">어디서</span> 알아내는가
      bullet_size: sm
      n:
      - 답 문자열 · 답의 확신도 · 종료 토큰 · 추론의 의미 · 내부 활성값 · 아무것도 안 읽음(예산)
      n_style: [sig]
      style: column
    - color: green
      k: ②
      t: 언제 판정하는가
      t_style: name
      bullets:
      - <span class="em">한 지점</span>만 보는가, 여러 지점을 <span class="em">모아서</span> 보는가
      bullet_size: sm
      n:
      - 순간 신호는 오답에서 과신한다는 것이 이 계열의 공통 출발점이다
      n_style: [sig]
      style: column
    - color: amber
      k: ③
      t: 기준을 어디서 얻는가
      t_style: name
      bullets:
      - 멈출지 말지를 가르는 <span class="em">임계값</span>이 어디서 오는가
      bullet_size: sm
      n:
      - 손으로 정함 · 이론에서 유도 · 데이터로 학습 · 돌려가며 적응
      n_style: [sig]
      style: column
    - color: rose
      k: ④
      t: 무엇을 비용으로 세는가
      t_style: name
      bullets:
      - 줄였다고 말할 때 <span class="em">무엇을 센</span> 것인가
      bullet_size: sm
      n:
      - 추론 토큰만 · 탐침 비용까지 · 실제 소요 시간
      n_style: [sig]
      style: column
- caption:
    text: |-
      * 네 질문은 독립적이다 — 같은 신호를 읽어도 ②③④에서 갈릴 수 있고, 실제로 그렇게 갈린다.<br>
      * 여기에 이 발표가 마지막에 덧붙이는 다섯 번째 질문이 있다 — <b>그 판정이 맞는지 확인했는가.</b> 43장에서 이 열이 거의 비어 있다는 것이 드러난다.
    style: fn
foot: 이 발표의 축
