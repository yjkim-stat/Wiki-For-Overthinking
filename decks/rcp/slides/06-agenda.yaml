# 06 — 구성
layout: content
eyebrow: Agenda
title: 네 개의 시기
blocks:
- lead: 같은 질문이 네 번 다시 물어진다 — <span class="em">수렴 시점을 어떻게 알아내는가.</span>
- cards:
    cols: 4
    style: fill
    items:
    - color: blue
      k: 2025
      t: 도구가 만들어지다
      t_style: name
      bullets:
      - 중간에 끊어 답을 뽑는 계측이 확정된다
      - 얕은 신호로 정지시켜 보고, 어디서 무너지는지 확인한다
      bullet_size: sm
      style: column
    - color: green
      k: 2026
      t: 같은 신호에 도달하다
      t_style: name
      bullets:
      - RCP가 수렴을 정의한다
      - 세 연구가 독립적으로 같은 토큰에 닿는다
      bullet_size: sm
      style: column
    - color: amber
      k: 가지
      t: 다르게 푸는 갈래
      t_style: name
      bullets:
      - 의미적 잉여 · 반성 억제 · 학습된 프로브
      bullet_size: sm
      style: column
    - color: rose
      k: 검증
      t: 되돌아온 재현
      t_style: name
      bullets:
      - 자기보고가 밖에서 재현되지 않는다
      - 아무도 재지 않은 것이 드러난다
      bullet_size: sm
      style: column
- caption:
    text: |-
      * 모든 수치는 원문 PDF에서 인용했고, 그 수치가 어떤 모델·벤치마크·설정에서 나왔는지는 해당 슬라이드 아래에 적는다. 자기보고와 외부 재현이 어긋나는 경우 양쪽을 모두 싣는다.
    style: fn
foot: Agenda
