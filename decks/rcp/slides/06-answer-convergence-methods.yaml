# 06 — 세 가지 정지 방법과 그 붕괴
layout: content
eyebrow: 2025 · EMNLP
eyebrow_color: blue
title: 세 방법, 그리고 하나만 살아남는다
body_height: 460px
blocks:
- lead: 같은 논문이 정지 방법 셋을 제안하고, <span class="em">두 개가 어려운 문제에서 무너지는 것</span>을 스스로 보고한다.
- cards:
    cols: 3
    items:
    - color: amber
      k: ①
      t: Answer Consistency
      t_style: name
      bullets:
      - 연속 <span class="mono">k</span>개 청크에서 같은 답이면 종료
      - 학습 없음
      bullet_size: sm
      n:
      - 신호 · 출력 문자열
      n_style: [sig]
      style: column
    - color: amber
      k: ②
      t: Think Token Adjustment
      t_style: name
      bullets:
      - <span class="mono">&lt;/think&gt;</span> 로짓을 분포의 뾰족함에 비례해 부스트
      - 확신할 때만 강하게 작용
      bullet_size: sm
      n:
      - 신호 · 종료 토큰
      n_style: [sig]
      style: column
    - color: green
      k: ③
      t: Learn-to-Stop
      t_style: name
      bullets:
      - 최종층 활성값 위의 LSTM 프로브
      - 라벨은 <span class="em">모델 자신의 수렴 지점</span> — 정답 불필요
      bullet_size: sm
      n:
      - 신호 · 활성값
      n_style: [sig]
      style: column
    style: margin-bottom:14px;
- table:
    head: [R1-Qwen-32B, NQ, GSM8K, MATH-500, GPQA, AIME’24]
    rows:
    - ['원본 정확도', '35.0', '89.4', '91.0', '33.3', '73.3']
    - ['① Answer Consistency', '<span class="k-green">38.4</span>', '<span class="k-green">91.0</span>', '<span class="k-rose">55.0</span>', '<span class="k-rose">14.1</span>', '<span class="k-rose">13.3</span>']
- note: 쉬운 쪽에서는 정확도가 오르고 토큰이 37% 준다. 어려운 쪽에서는 AIME에서 60점이 날아간다. 활성값 프로브만 버틴다.
cite:
- liu2025
foot: Part 1 · Answer Convergence
