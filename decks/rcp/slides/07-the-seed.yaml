# 07 — 계보의 씨앗
layout: content
eyebrow: 2025 · EMNLP
eyebrow_color: violet
title: <span class="mono">&lt;/think&gt;</span>는 이미 top-10 안에
body_height: 490px
blocks:
- lead: 같은 논문 §4.2에, 1년 뒤 <span class="em">RCPD</span><span class="ref">(RCP의 온라인 탐지기 · 15장)</span>가 통째로 올라앉게 되는 관찰이 있다.
- card:
    color: violet
    t: |-
      “<span class="mono">&lt;/think&gt;</span>가 문장 경계 뒤에서 <span class="em">상위 10개 후보 안에 드는 경우가 많은데</span>,
      모델은 <span class="mono">wait</span>, <span class="mono">or</span>, <span class="mono">but</span> 같은 토큰을 선호해 추론을 불필요하게 늘린다.”
    t_style: font-size:20px;line-height:1.6;
    style: padding:18px 22px;margin-bottom:14px;
- cards:
    cols: 2
    style: fill
    items:
    - color: plain
      k: 2025년의 처방
      t: 로짓을 민다
      t_style: name
      bullets:
      - 종료 토큰의 로짓에 값을 더해 <span class="em">더 잘 뽑히게</span> 만든다
      - 분포가 뾰족할수록 세게 밀어, 확신할 때만 작용
      bullet_size: sm
      n:
      - 순위는 <span class="em">바꾸는 대상</span>이다
      n_style: [sig]
      style: column
    - color: violet
      k: 2026년의 처방
      t: rank를 읽는다
      t_style: name
      bullets:
      - 같은 순위를 건드리지 않고 <span class="em">정지 시점의 신호로</span> 쓴다
      - 임계값을 <span class="mono em">5</span>와 <span class="mono em">10</span>에 둔다 — 인용된 “top-10”이 그대로 숫자가 된다
      bullet_size: sm
      n:
      - 순위는 <span class="em">읽는 대상</span>이다
      n_style: [sig]
      style: column
- note: 관찰은 같고 쓰임이 뒤집혔다. RCP 논문은 이 논문을 인용하지만, 자기 임계값이 어디서 왔는지는 밝히지 않는다.
cite:
- liu2025
- wei2026
foot: Part 1 · Answer Convergence
