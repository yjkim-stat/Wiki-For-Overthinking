# 09 — ACR 정의
layout: content
eyebrow: 2025 · EMNLP
eyebrow_color: blue
title: ACR — 답이 굳는 지점의 위치
blocks:
- lead: 절단을 한 바퀴 돌리면 문항마다 숫자 하나가 나온다.
- text:
    text: |-
      <span class="mono em">ACR = 답이 더 이상 바뀌지 않는 최초 청크 ÷ 전체 청크 수</span>
    style: formula
- cards:
    cols: 2
    items:
    - color: green
      t: <span class="mono">ACR = 0.2</span>
      t_style: name
      bullets:
      - trace의 20% 지점에서 이미 답이 굳었다
      - 나머지 80%는 답을 바꾸지 못했다
      bullet_size: sm
      style: column
    - color: rose
      t: <span class="mono">ACR = 0.9</span>
      t_style: name
      bullets:
      - 90% 지점까지 답이 계속 바뀌었다
      - 끝까지 가야 했던 문항이다
      bullet_size: sm
      style: column
    style: margin-top:8px;
- caption:
    text: |-
      * 청크는 문장 단위다. ACR이 낮다고 <b>정답</b>이라는 뜻은 아니다 — 틀린 답으로 일찍 굳어도 ACR은 낮다. 수렴은 정지 신호이지 정답의 근거가 아니라는 점이 이 계열 전체에 걸린 단서다.
    style: fn
cite:
- liu2025
foot: Part 1 · 계측
