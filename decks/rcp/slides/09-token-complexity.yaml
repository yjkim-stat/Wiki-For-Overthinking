# 09 — 하한은 이미 나와 있었다
layout: content
eyebrow: 2025
eyebrow_color: violet
title: Token complexity — 압축의 하한
blocks:
- lead: 문항마다 <span class="em">그 모델이 맞히는 데 필요한 최소 추론 길이</span>가 있다. 그것을 추정할 수 있다면, 모든 압축 방법은 같은 자로 재어진다.
- cards:
    cols: 2
    style: fill
    items:
    - color: violet
      t: 하나의 곡선
      t_style: name
      bullets:
      - 압축 프롬프트 <span class="em">31개</span>를 늘어놓았더니
      - 프롬프트 계열마다 다른 선이 아니라 (모델, 벤치마크)마다 <span class="em">단 하나의</span> 정확도–길이 곡선 위에 놓인다
      bullet_size: sm
      n:
      - 프롬프트를 어떻게 쓰느냐는 그 곡선 위에서 <span class="em">어디에 서느냐</span>를 정할 뿐이다
      n_style: [claim]
      style: column
    - color: rose
      t: 무엇이 달라지나
      t_style: name
      bullets:
      - 지금까지의 보고는 전부 <span class="em">“자르지 않은 경우 대비 몇 % 절감”</span>이다
      - 그 기준선은 논문마다 다르므로 서로 비교할 수 없다
      - 하한을 기준으로 삼으면 <span class="em">같은 자</span> 위에 놓인다
      bullet_size: sm
      n:
      - 실제로 예산을 추정해 자르는 방식은 단순한 정적 프롬프트가 그리는 곡선 <span class="em">아래</span>에 있다 — 추정이 손해를 본 사례
      n_style: [cost]
      style: column
- note: 이 곡선이 실재한다면, 뒤에 나오는 기법들의 우열은 서로 다른 선이 아니라 한 선 위의 위치 다툼이다. 하한까지 얼마나 남았는지는 32장에서 수치로 본다.
cite:
- lee2025
foot: Part 1 · 2025
