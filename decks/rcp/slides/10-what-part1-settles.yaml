# 10 — Part 1 정리
layout: content
eyebrow: Where Part 1 Lands
eyebrow_color: blue
title: 2025가 확정한 것
blocks:
- cards:
    cols: 2
    style: fill
    items:
    - color: green
      k: 확립된 것
      t: 간극은 실재한다
      t_style: name
      bullets:
      - 답은 trace가 끝나기 한참 전에 굳는다 — ACR 0.8~0.9
      - 쉬운 문항에서는 명시적 추론이 아예 불필요 (ACR ≈ 0.0)
      - 계측 도구가 확정됐다 — 절단 + <span class="mono">&lt;/think&gt;</span> 강제 주입
      bullet_size: sm
      style: column
    - color: rose
      k: 남은 것
      t: 세 가지 미해결
      t_style: name
      bullets:
      - 얕은 신호는 <span class="em">필요 없는 곳에서만</span> 작동한다 (AIME 73.3 → 13.3)
      - 같은 경계가 다른 계측에서도 나온다 — latent 답 형성 지표가 MGSM 0.38에서 AIME 0.03으로 붕괴
      - 종료 토큰은 이미 상위권에 있는데 <span class="em">왜 안 따르는지</span> 설명이 없다
      - 하한 대비 달성률이 <span class="em">4분의 1 이하</span>인데 아무도 하한을 기준으로 보고하지 않는다
      bullet_size: sm
      style: column
- note: 2026년의 연구들은 두 번째 질문에 세 방향에서 동시에 답한다. 첫 번째와 세 번째는 지금도 열려 있다.
