# 12 — RCP의 정의
layout: content
eyebrow: 2026 · ACL
eyebrow_color: green
title: RCP — 두 조건의 논리곱
body_height: 470px
blocks:
- lead: 수렴을 <span class="em">두 개의 독립된 안정성이 동시에 성립하는 순간</span>으로 정의한다. 이것이 이 논문의 실제 기여다.
- text:
    text: |-
      <span class="mono em">k<sub>RCP</sub> = min { k : Δ<sub>content</sub>(k) ≤ ε<sub>c</sub> &nbsp;∧&nbsp; D<sub>KL</sub>(Q<sub>k</sub> ‖ Q<sub>∞</sub>) ≤ ε<sub>D</sub> }</span>
    style: formula
- cards:
    cols: 2
    items:
    - color: blue
      k: 길이 렌즈
      t: 답변이 더 길어지지 않는다
      t_style: name
      bullets:
      - 초기엔 생각이 부족하면 <span class="em">추론을 답변 쪽으로 떠넘긴다</span>
      - 어느 순간 답변 길이가 좁은 띠로 수축, 100스텝을 더 줘도 불변
      bullet_size: sm
      style: column
    - color: green
      k: 의미 렌즈
      t: 답 분포가 종단에 닿았다
      t_style: name
      bullets:
      - 절단점마다 continuation 다수 샘플링 → 임베딩 → PCA → 가우시안 적합
      - 종단 분포와의 KL이 낮은 plateau로 안착
      bullet_size: sm
      style: column
    style: fill
- note: 논리곱이 설계의 전부다. 길이만 보면 “짧게 헤매는 중”과 못 가르고, 의미만 보면 답은 정해졌는데 서술이 흐르는 경우를 놓친다.
cite:
- wei2026
foot: Part 2 · RCP
