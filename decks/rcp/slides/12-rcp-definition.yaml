# 12 — RCP의 정의
layout: content
eyebrow: 2026 · ACL
eyebrow_color: green
title: RCP — 두 조건의 논리곱
blocks:
- lead: <span class="em">독립된 두 안정성이 동시에 성립하는 순간</span>을 수렴으로 잡는다. 이 정의가 논문의 본체다.
- text:
    text: |-
      <span class="mono em">k<sub>RCP</sub> = min { k : Δ<sub>content</sub>(k) ≤ ε<sub>c</sub> &nbsp;∧&nbsp; D<sub>KL</sub>(Q<sub>k</sub> ‖ Q<sub>∞</sub>) ≤ ε<sub>D</sub> }</span>
    style: formula
- cards:
    cols: 2
    items:
    - color: blue
      k: 길이 렌즈
      t: 답변이 더 길어지지 않는다
      t_style: name
      bullets:
      - 초기엔 생각이 부족하면 <span class="em">추론을 답변 쪽으로 떠넘긴다</span>
      - 어느 순간 답변 길이가 좁은 띠로 수축, 100스텝을 더 줘도 불변
      bullet_size: sm
      style: column
    - color: green
      k: 의미 렌즈
      t: 답 분포가 종단에 닿았다
      t_style: name
      bullets:
      - 절단점마다 continuation 다수 샘플링 → 임베딩 → PCA → 가우시안 적합
      - 종단 분포와의 KL이 낮은 plateau로 안착
      bullet_size: sm
      style: column
- box:
    style: ph
    blocks:
    - text: { text: "▣ Pre/Post-RCP 길이 동역학", style: ph-title }
    - text: { text: "Wei 외 (2026) Figure 2 · AIME24 Q19, AIME25 Q17", style: ph-src }
- note: 5장의 ACR은 이 <span class="mono">k<sub>RCP</sub></span>를 trace 길이로 나눈 것과 같은 양이다 — 같은 지점을 문자열 동일성으로 잡았을 뿐이고, 1년 앞선다.
- note: 논리곱이 설계의 전부다. 길이만 보면 “짧게 헤매는 중”과 못 가르고, 의미만 보면 답은 정해졌는데 서술이 흐르는 경우를 놓친다.
cite:
- wei2026
foot: Part 2 · RCP
