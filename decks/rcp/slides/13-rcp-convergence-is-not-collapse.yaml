# 13 — 수렴은 정지가 아니다
layout: content
eyebrow: Semantic Dynamics
eyebrow_color: green
title: Semantic basin — 97.3% 잔류
blocks:
- lead: <span class="mono">D<sub>global</sub></span>의 plateau가 <span class="em">0이 아니다</span> — 수렴이 곧 정지는 아니라는 뜻.
- cards:
    cols: 2
    items:
    - color: green
      t: 측정
      t_style: name
      bullets:
      - 2D PCA 평면에 <span class="em">95% Mahalanobis 신뢰타원</span>을 적합
      - 전이 이후 지점의 <span class="k-green em">97.3%</span>가 그 안에 남는다
      - 다른 두 사례에서 94.3%, 96.5%
      bullet_size: sm
      n:
      - 수렴 주장을 반증 가능한 형태로 만든 몇 안 되는 사례
      n_style: [sig]
      style: column
    - color: rose
      t: 해석
      t_style: name
      bullets:
      - 궤적이 <span class="em">멈추는 것이 아니라</span> basin 안에서 계속 진동한다
      - 의미적으로 비슷한 후보들 사이의 <span class="em">동적 평형</span>
      bullet_size: sm
      n:
      - 논문은 이 구간을 <span class="em">cognitive inertia</span>라 부른다 — Post-RCP는 정지가 아니라 제자리 맴돌기
      n_style: [claim]
      style: column
