# 14 — 같은 관찰, 두 처방
layout: content
eyebrow: 2025 → 2026
eyebrow_color: violet
title: 같은 순위, 밀 것인가 읽을 것인가
blocks:
- lead: 앞 장의 관찰을 두 시기가 정반대로 쓴다.
- cards:
    cols: 2
    style: fill
    items:
    - color: plain
      k: 2025년의 처방
      t: 순위를 <span class="em">바꾼다</span>
      t_style: name
      bullets:
      - 종료 토큰의 로짓에 값을 더해 더 잘 뽑히게 만든다
      - 순위는 <span class="em">개입 대상</span>이다
      bullet_size: sm
      n:
      - 부작용 · 너무 세게 밀면 어려운 문항에서 조기 절단이 난다
      n_style: [cost]
      style: column
    - color: violet
      k: 2026년의 처방
      t: 순위를 <span class="em">읽는다</span>
      t_style: name
      bullets:
      - 순위를 건드리지 않고 정지 시점의 신호로만 쓴다
      - 임계값을 <span class="mono em">5</span>와 <span class="mono em">10</span>에 둔다 — 인용된 “top-10”이 그대로 숫자가 된다
      bullet_size: sm
      n:
      - 이 쪽이 Part 2의 RCPD다
      n_style: [sig]
      style: column
- caption:
    text: |-
      * RCP 논문은 이 2025년 논문을 인용하지만, 자기 임계값이 어디서 왔는지는 밝히지 않는다.
    style: fn
cite:
- liu2025
- wei2026
foot: Part 1 · 계측
