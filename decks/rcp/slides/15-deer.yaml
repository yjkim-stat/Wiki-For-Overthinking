        head: ['<span class="k-blue">①</span> 무엇을 읽나', '<span class="k-green">②</span> 언제 판정', '<span class="k-amber">③</span> 기준 출처', '<span class="k-rose">④</span> 비용']
        rows:
        - ['답 확신도', '한 지점', '손으로 고정', '추론 토큰만']
