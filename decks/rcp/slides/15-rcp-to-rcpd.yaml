# 15 — 오프라인 정의를 온라인으로
layout: content
eyebrow: Distill-to-Detect
eyebrow_color: green
title: 오프라인 정의 → 온라인 프록시
blocks:
- lead: <span class="mono">Q<sub>∞</sub></span>는 trace가 끝나야 추정된다 — <span class="em">정의를 디코딩 중에 계산할 방법이 없다.</span>
- cards:
    cols: 3
    style: fill
    items:
    - color: blue
      k: ①
      t: 오프라인 라벨
      t_style: name
      bullets:
      - Math-500에서 인스턴스마다 <span class="mono">k<sub>RCP</sub></span>를 완전 계산
      - gold supervision으로 취급
      bullet_size: sm
      style: column
    - color: violet
      k: ②
      t: 관측 가능한 프록시
      t_style: name
      bullets:
      - <span class="mono">k<sub>RCP</sub></span>는 대체로 <span class="em">최종 답의 첫 등장</span>과 일치
      - 그런데 답의 표면형이 제각각이라 문자열 기준은 취약
      - 답이 처음 나타나는 순간, 이 토큰에 무엇이 일어나는지가 열쇠가 된다
      bullet_size: sm
      style: column
    - color: green
      k: ③
      t: 규칙으로 증류
      t_style: name
      bullets:
      - rank + 직전 이력 위에 decision tree
      - 결정적 기호 규칙으로 증류해 배포
      bullet_size: sm
      style: column
- note: 정의는 라벨을 만드는 데만 쓰이고, 배포되는 것은 전혀 다른 신호다. 그 둘이 같은 것을 가리키는지는 30장에서 다시 묻는다.
cite:
- wei2026
foot: Part 2 · RCPD
