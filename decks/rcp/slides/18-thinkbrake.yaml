# 18 — ThinkBrake
layout: content
eyebrow: 2026 · ACL Findings
eyebrow_color: violet
title: 같은 토큰, 유도된 규칙
blocks:
- lead: RCPD와 같은 자리에서 같은 토큰을 읽되, <span class="em">임계값을 정하는 대신 유도한다.</span>
- cards:
    cols: 2
    items:
    - color: violet
      t: 규칙
      t_style: name
      bullets:
      - 문장 경계에서 top 토큰과 <span class="mono">&lt;/think&gt;</span>의 <span class="em">로그확률 마진</span> <span class="mono">m<sub>t</sub></span>
      - <span class="mono">m<sub>t</sub> &lt; τ</span> 이면 종료 — 파라미터 하나 (<span class="mono">τ = 0.1</span>)
      bullet_size: sm
      n:
      - 마진 검사가 <span class="em">온도 스케일된 로짓 마진 검사</span>와, 나아가 <span class="mono">&lt;/think&gt;</span> 로짓에 상수 보너스 <span class="mono">τ·T</span>를 더하는 KL-정규화 policy realignment와 <span class="em">동치</span>임을 증명한다
      n_style: [claim]
      style: column
    - color: rose
      t: 함수형이 중요하다
      t_style: name
      bullets:
      - raw 확률 차이 변형(ThinkBrake-p)은 AIME에서 <span class="k-rose">30–35%</span>
      - 로그 버전은 <span class="k-green">62–67%</span>
      bullet_size: sm
      n:
      - 같은 신호라도 어떤 함수로 읽느냐가 결과를 가른다. RCPD의 rank(순서 통계량)는 세 번째 선택지인데, 셋을 비교한 연구는 아직 없다.
      n_style: [claim]
      style: column
    style: fill
- note: oracle 분석 — 모든 경계에서 잘라보고 사후 최적을 고르면 AIME 실패의 61%가 회복되고 토큰 44% 절감, 회복 불가 오류는 5% 미만. 이 클러스터의 상한선.
cite:
- song2026
