# 19 — NEAT
layout: content
eyebrow: 2026 · ACL Findings
eyebrow_color: amber
title: NEAT — exit-associated neurons
blocks:
- lead: 같은 종료 토큰을 <span class="em">그것을 만들어내는 뉴런 쪽에서</span> 읽는다.
- cards:
    cols: 2
    items:
    - color: amber
      t: exit-associated neurons
      t_style: name
      bullets:
      - FFN 뉴런 각각의 <span class="em">종료 토큰 예측 기여도</span>를 로그확률 증가법으로 귀속
      - 활성 궤적의 <span class="mono">Relative Center of Mass</span>(후반 집중)와 <span class="mono">Activation Entropy</span>(낮은 분산)로 필터
      bullet_size: sm
      style: column
    - color: green
      t: 등급 개입
      t_style: name
      bullets:
      - 정렬 강함 → 즉시 종료
      - 중간 → <span class="em">reflection 토큰 로짓을 −∞로 억제</span> (종료는 안 시킴)
      - 약함 → 무개입
      bullet_size: sm
      n:
      - 22–28% 토큰 절감, 그리고 <span class="em">wall-clock도 21–23% 감소</span> — 추가 forward pass가 없기 때문
      n_style: [claim]
      style: column
    style: fill
- note: 같은 논문이 CGRS의 confidence 계산 오버헤드가 출력을 줄이면서도 실제 지연을 41–63% 늘린다고 측정한다. 토큰과 시간은 같은 것이 아니다.
