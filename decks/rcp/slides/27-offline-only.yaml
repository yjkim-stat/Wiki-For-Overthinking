# 27 — 정의는 온라인에서 못 쓴다
layout: content
eyebrow: 2026 · ACL
eyebrow_color: amber
title: 정의를 디코딩 중에 계산할 방법이 없다
blocks:
- lead: <span class="mono">Q<sub>∞</sub></span>는 <span class="em">trace 끝부분</span>으로 추정한다. 아직 생성 중인 모델은 자기 끝을 모른다.
- cards:
    cols: 2
    style: fill
    items:
    - color: rose
      t: 정의가 요구하는 것
      t_style: name
      bullets:
      - 매 절단 지점에서 답을 <span class="em">여러 개</span> 생성
      - 그 분포를 <span class="em">최종 분포</span>와 비교
      bullet_size: sm
      n:
      - 둘 다 생성이 끝난 뒤에야 가능하다
      n_style: [cost]
      style: column
    - color: green
      t: 그래서 택한 우회로
      t_style: name
      bullets:
      - 정의는 <span class="em">라벨을 만드는 데만</span> 쓴다
      - 배포는 디코딩 중에 공짜로 읽히는 <span class="em">다른 신호</span>로 한다
      bullet_size: sm
      n:
      - 논문은 이것을 distill-to-detect라 부른다
      n_style: [sig]
      style: column
- caption:
    text: |-
      * 라벨은 <b>MATH-500</b>에서 오프라인으로 만든다. 그 라벨을 맞히도록 학습한 규칙을 AIME·GPQA에 그대로 적용한다.<br>
      * <b>여기서 정의와 배포가 갈라진다.</b> 두 신호가 실제로 같은 것을 가리키는지는 Part 4에서 다시 묻는다.
    style: fn
cite:
- wei2026
foot: Part 2
