      * <span class="mono">R<sub>t</sub></span>는 그 지점에서 <span class="mono">&lt;/think&gt;</span>가 다음 토큰 후보 중 몇 위인가. <b>1위가 가장 유력</b>하고 숫자가 클수록 덜 유력하다. <span class="mono">R<sub>t−k</sub></span>는 <span class="mono">k</span>개 앞 지점의 같은 값.<br>
      * 학습은 MATH-500에서 결정트리로 하고, 그 트리를 위 네 규칙으로 옮겨 적어 배포한다. 추론 모델 자체는 건드리지 않는다.
