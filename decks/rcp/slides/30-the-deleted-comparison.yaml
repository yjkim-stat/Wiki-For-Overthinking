eyebrow: Part 4
eyebrow_color: rose
title: 프리프린트와 게재본이 다르다
blocks:
- lead: arXiv v2에는 있고 ACL 카메라레디에는 없는 행이 하나 있다.
- table:
    head: [Qwen3-8B · AIME24, 토큰, 정확도]
    rows:
    - ['RCPD', '9,958 (65%)', '72.22']
    - ['<span class="em">S-GRPO</span> <span class="ref">— arXiv v2에만</span>', '<span class="k-green">8,810 (57%)</span>', '<span class="k-green">77.30</span>']
- bullets:
    bullets:
    - arXiv 본문은 인정한다 — “<span class="em">GPQA-D에서는 이기지만 AIME24에서는 진다</span>”. 실제로 GPQA-D에서는 64.65 대 55.40으로 뒤집힌다.
    - 게재본은 표의 행, 이 문장, §5.3 베이스라인 목록에서 S-GRPO를 <span class="em">전부</span> 없앴다. 문자열 등장 횟수 8회 → 1회(Related Work뿐).
    size: sm
    style: margin-top:12px;
- card:
    color: amber
    t: |-
      S-GRPO는 훈련 기반 방법이고, 추론 시점 비교에서 빼는 것은 <span class="em">방어 가능한 편집 결정</span>이다.
      동기를 추정하지 않되 결과는 적는다 — <span class="em">게재본만 읽은 평가는 RCPD의 위치를 과대평가한다.</span>
    t_style: font-size:18px;line-height:1.6;
