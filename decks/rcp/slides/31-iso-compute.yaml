# 31 — iso-compute
layout: content
eyebrow: Iso-Compute
eyebrow_color: green
title: 같은 예산에서 13점 차
blocks:
- lead: 고정 예산 방식에 <span class="em">배포 시엔 얻을 수 없는 이점</span>을 주고 비교한다.
- card:
    color: blue
    t: |-
      Budget Force<span class="ref">(문항마다 토큰 상한을 미리 정해두고 넘으면 자르는 방식)</span>의 상한을 각 (모델, 벤치마크)마다
      <span class="em">RCPD가 실제로 쓴 평균 토큰 수에 사후로 맞춘다.</span> 논문 스스로 “배포 시엔 얻을 수 없는 전역 튜닝의 이점을 준 것”이라 적는다.
    t_style: font-size:18px;line-height:1.6;
    style: padding:16px 20px;margin-bottom:12px;
- box:
    style: flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:4px 0;
    blocks:
    - box:
        style: position:relative;line-height:0;overflow:hidden;border-radius:6px;
        blocks:
        - image:
            src: rcp-table1-qwen8b.png
            alt: Qwen3-8B 블록에서 Budget Force와 RCPD 행
            style: display:block;max-height:300px;width:auto;
        - html: '<div style="position:absolute;left:0.5%;top:54.5%;width:99%;height:9%;border:2.5px solid var(--rose);border-radius:4px;background:rgba(214,69,96,.09);"></div>'
        - html: '<div style="position:absolute;left:0.5%;top:76.8%;width:99%;height:9%;border:2.5px solid var(--green);border-radius:4px;background:rgba(214,69,96,.09);"></div>'
- caption:
    text: |-
      * <b>모델</b> Qwen3-8B · <b>벤치마크</b> AIME 2024(30문항) · <b>디코딩</b> temperature 0.6 / top-p 0.95 / 최대 32,768 토큰.<br>
      * 거의 같은 예산에서 13점이 갈린다 — <b>얼마나 자르느냐가 아니라 어디서 자르느냐</b>가 문제라는 뜻이고, 고정 예산 계열 전체에 대한 반론이다.<br>
      * 원논문 표 기준으로 RCPD는 BF·DEER를 모든 모델에서 지배한다. <b>이 주장은 45장에서 외부 재현과 부딪힌다.</b>
    style: fn
