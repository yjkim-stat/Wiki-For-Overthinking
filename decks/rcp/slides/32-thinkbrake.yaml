# 32 — ThinkBrake
layout: content
eyebrow: 2026 · ACL Findings
eyebrow_color: violet
title: ThinkBrake — 같은 토큰, 유도된 규칙
blocks:
- lead: RCPD와 같은 자리에서 같은 토큰을 읽되, 임계값을 정하는 대신 <span class="em">어디서 왔는지를 증명한다.</span>
- box:
    cls: qstrip
    blocks:
    - table:
        head: ['<span class="k-blue">①</span> 무엇을 읽나', '<span class="k-green">②</span> 언제 판정', '<span class="k-amber">③</span> 기준 출처', '<span class="k-rose">④</span> 비용']
        rows:
        - ['종료 토큰 마진', '한 지점', '이론에서 유도', '추론 토큰만']
- cards:
    cols: 2
    style: fill
    items:
    - color: violet
      t: 규칙과 그 정체
      t_style: name
      bullets:
      - 문장 경계에서 1위 토큰과 <span class="mono">&lt;/think&gt;</span>의 <span class="em">로그확률 차이</span>가 <span class="mono">τ</span>보다 작으면 종료
      - 파라미터가 <span class="em">하나뿐</span>이다 (<span class="mono">τ = 0.1</span>)
      bullet_size: sm
      n:
      - 이 검사가 <span class="mono">&lt;/think&gt;</span> 로짓에 <span class="em">상수를 더하는 것</span>과 수학적으로 같음을 증명한다 — 임계값이 매직넘버가 아니라 유도된 값이 된다
      n_style: [claim]
      style: column
    - color: rose
      t: 어떻게 읽느냐가 결과를 가른다
      t_style: name
      bullets:
      - 같은 신호를 <span class="em">확률 차이</span>로 읽으면 AIME 30–35%
      - <span class="em">로그확률 차이</span>로 읽으면 62–67%
      bullet_size: sm
      n:
      - RCPD의 rank(순위)는 세 번째 선택지인데, 셋을 같은 조건에서 비교한 연구는 아직 없다
      n_style: [cost]
      style: column
- caption:
    text: |-
      * <b>모델</b> Qwen3-4B-Thinking 등 6종 · <b>벤치마크</b> AIME 2024/2025 포함 8종 · 정확도(%).<br>
      * 같은 논문의 <b>oracle 분석</b> — 모든 경계에서 잘라보고 사후에 최적을 고르면 AIME 실패의 61%가 회복되고 토큰은 44% 준다. 회복 불가능한 오류는 5% 미만. <b>이 계열이 도달할 수 있는 상한선</b>이다.
    style: fn
cite:
- song2026
foot: Part 2 · 2026
