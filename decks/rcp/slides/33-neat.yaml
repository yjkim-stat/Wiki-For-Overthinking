# 33 — NEAT
layout: content
eyebrow: 2026 · ACL Findings
eyebrow_color: amber
title: NEAT — 출력보다 한 층 안쪽
blocks:
- lead: 같은 종료 토큰을 <span class="em">그것을 만들어내는 뉴런 쪽에서</span> 읽는다.
- box:
    cls: qstrip
    blocks:
    - table:
        head: ['<span class="k-blue">①</span> 무엇을 읽나', '<span class="k-green">②</span> 언제 판정', '<span class="k-amber">③</span> 기준 출처', '<span class="k-rose">④</span> 비용']
        rows:
        - ['내부 활성값', '활성 궤적', '보정셋에서', '추론 토큰만 (오버헤드 없음)']
- cards:
    cols: 2
    style: fill
    items:
    - color: amber
      t: 종료 전담 뉴런을 찾는다
      t_style: name
      bullets:
      - 각 뉴런이 종료 토큰 예측에 얼마나 기여하는지 귀속시킨다
      - 그중 <span class="em">후반에 집중적으로, 일관되게</span> 켜지는 것만 남긴다
      bullet_size: sm
      style: column
    - color: green
      t: 세 단계로 개입한다
      t_style: name
      bullets:
      - 강하게 켜짐 → <span class="em">즉시 정지</span>
      - 중간 → <span class="em">반성 토큰만 억제</span>하고 정지는 안 시킴
      - 약함 → 그대로 둔다
      bullet_size: sm
      style: column
- caption:
    text: |-
      * <b>모델</b> R1-Distill-Qwen-7B / R1-Distill-Llama-8B, Qwen3-8B/14B · <b>벤치마크</b> MATH-500 · AMC23 · AIME24 · GPQA-Diamond.<br>
      * 토큰 <b>22–28%</b> 절감에 정확도는 개입 없음과 비슷하고, <b>실제 소요 시간도 21–23% 준다</b> — 추가 forward pass가 없기 때문.<br>
      * 같은 논문이 확신도 계산형 방법<span class="ref">(CGRS, 40장)</span>은 출력을 줄이면서도 <b>실제 시간을 41–63% 늘린다</b>고 측정한다. <b>토큰과 시간은 같은 것이 아니다.</b>
    style: fn
cite:
- liu2026neat
- huang2026
foot: Part 2
