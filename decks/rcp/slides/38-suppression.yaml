# 38 — 억제 갈래
layout: content
eyebrow: Branch ② · Reflection Suppression
eyebrow_color: rose
title: 멈추는 대신 되돌아가지 못하게 한다
blocks:
- lead: 정지시키지 않고 <span class="em">“Wait”으로 되돌아가는 길 자체를 막는다.</span> 무조건에서 조건부로 옮겨왔다.
- cards:
    cols: 3
    style: fill
    items:
    - color: plain
      k: 원형
      t: No-Wait
      t_style: name
      bullets:
      - <span class="mono">wait</span>, <span class="mono">hmm</span> 같은 토큰을 <span class="em">확신도와 무관하게</span> 막는다
      bullet_size: sm
      n:
      - 어려운 과제에서 성능이 떨어진다 — 필요한 자기검증까지 없애기 때문
      n_style: [cost]
      style: column
    - color: rose
      k: 조건부
      t: CGRS
      t_style: name
      bullets:
      - 중간 답을 뽑아 그 <span class="em">확신도</span>를 재고
      - 확신할수록 <span class="em">높은 확률로</span> 억제, 불확실하면 그냥 둔다
      bullet_size: sm
      n:
      - 18.5–41.9% 절감에 정확도 보존. 항상-억제(=No-Wait)를 자기 표에서 지배한다
      n_style: [claim]
      style: column
    - color: amber
      k: 내부 신호
      t: NEAT
      t_style: name
      bullets:
      - 같은 억제를 하되 판단을 <span class="em">종료 전담 뉴런의 활성값</span>에 맡긴다
      - 억제가 정지 직전의 중간 단계
      bullet_size: sm
      n:
      - 답을 뽑아보지 않으므로 오버헤드가 없다
      n_style: [claim]
      style: column
- caption:
    text: |-
      * 세 지점의 차이는 “무엇을 막나”가 아니라 <b>“언제 막아도 되는지를 무엇으로 판단하나”</b>이다 — 아무것도 안 보고 / 답을 뽑아보고 / 내부 상태를 보고.
    style: fn
