# 39b — DTSR
layout: content
eyebrow: Branch ③ · 학습된 프로브
eyebrow_color: blue
title: DTSR — 중간 답을 아예 뽑지 않는 우회로
blocks:
- lead: 지금까지의 방법은 대부분 <span class="em">중간 답을 뽑아본다.</span> 답이 길거나 열려 있으면 그게 불가능하다.
- cards:
    cols: 2
    style: fill
    items:
    - color: rose
      t: 문제
      t_style: name
      bullets:
      - 답이 한 줄짜리 숫자면 뽑아서 비교할 수 있다
      - 코드나 서술형이면 <span class="em">뽑아도 비교가 안 된다</span>
      bullet_size: sm
      n:
      - 42장 사다리의 위쪽 두 층위가 통째로 막히는 상황이다
      n_style: [cost]
      style: column
    - color: blue
      t: 처방
      t_style: name
      bullets:
      - 반성 신호(<span class="mono">Wait</span> 등)가 나올 때마다
      - 모델에게 <span class="em">3인칭 관점에서</span> 자기 추론이 충분한지 0–100으로 매기게 한다
      - 임계값을 넘으면 종료
      bullet_size: sm
      n:
      - 답을 뽑는 대신 <span class="em">자기 평가를 뽑는다</span>
      n_style: [sig]
      style: column
- caption:
    text: |-
      * <b>3인칭으로 묻는 것</b>이 설계의 핵심이다. 같은 논문이 1인칭으로 물었을 때(“네 추론이 충분한가”)보다 정확도와 길이 양쪽에서 낫다고 보고한다 — 생성과 판단을 분리해야 자기 평가가 작동한다는 주장.<br>
