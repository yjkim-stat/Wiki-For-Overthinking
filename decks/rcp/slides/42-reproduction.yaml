title: 밖에서 다시 돌리면 거의 줄지 않는다
blocks:
- lead: CoDE-Stop 논문이 자기 방법을 내놓으면서 <span class="em">선행 다섯 기법을 같은 궤적 위에서 함께 돌렸다.</span>
- table:
    head: [남은 토큰 비율 (%), Qwen3-4B, Qwen3-14B, DS-Llama-8B, Nemotron-8B]
    rows:
    - ['자르지 않음', '100.0', '100.0', '100.0', '100.0']
    - ['DEER', '70.0', '55.3', '73.2', '80.8']
    - ['<span class="em">RCPD</span>', '<span class="k-rose">96.9</span>', '<span class="k-rose">91.3</span>', '<span class="k-rose">100.0</span>', '<span class="k-rose">96.2</span>']
    - ['Answer Convergence', '20.3', '23.3', '33.1', '29.9']
