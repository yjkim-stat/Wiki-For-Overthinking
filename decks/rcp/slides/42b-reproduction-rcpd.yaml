- caption:
    text: |-
      * 자기 논문의 주장은 <b>최대 44% 절감</b>이었고, 34장에서 본 “BF·DEER를 지배한다”도 그 표 기준이었다. 여기서는 <b>0–9%</b>다.<br>
      * DeepSeek-R1 행은 <span class="mono">CR 100.0</span> — 토큰이 7,518로 개입 없음의 7,514보다 오히려 많다.<br>
