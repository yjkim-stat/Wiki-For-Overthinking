- caption:
    text: |-
      * <b>추론 토큰</b>은 생각 부분의 길이, <b>총 비용</b>은 중간 답을 뽑느라 생성한 것까지 더한 값이다.<br>
      * Think or Not은 생각을 21% 줄이지만 <b>실제로는 40% 더 쓴다</b> — 탐침 비용이 절감분을 넘어선다.<br>
      * 이 회계를 하지 않는 논문이 다수다. 36장의 NEAT은 같은 문제를 시간으로 재서, 확신도 계산형 방법이 출력을 줄이면서 <b>실제 시간을 41–63% 늘린다</b>고 보고했다.
