- lead: 중간 답을 뽑아보는 방법은 <span class="em">그 답도 생성해야 한다.</span> 그 몫을 세면 순위가 바뀐다.
- table:
    head: [Qwen3-4B 평균, 추론 토큰, 총 비용]
