    - ['개입 없음', '8,344', '8,344']
    - ['Think or Not <span class="ref">중간 답으로 판정하는 선행 기법</span>', '<span class="k-green">6,595</span> <span class="ref">(−21%)</span>', '<span class="k-rose">11,668</span> <span class="ref">(+40%)</span>']
