# 46 — 유보
layout: content
eyebrow: Caveats
eyebrow_color: amber
title: 재현 실패를 판결로 읽으면 안 되는 이유
blocks:
- lead: 48장은 <span class="em">그 프로토콜에서의 사실</span>이지 방법에 대한 판결이 아니다.
- cards:
    cols: 3
    style: fill
    items:
    - color: plain
      k: ①
      t: 모델이 다르다
      t_style: name
      bullets:
      - Qwen3-4B와 Nemotron-8B는 원논문에 없다
      - DeepSeek도 Llama distill 쪽이라 원논문과 다른 체크포인트
      bullet_size: sm
      style: column
    - color: plain
      k: ②
      t: 벤치마크 조합이 다르다
      t_style: name
      bullets:
      - AIME24·25를 합산하고 MATH-500·GSM8K를 추가했다
      - 겹치는 것은 Qwen3-14B와 GPQA-Diamond 정도
      bullet_size: sm
      style: column
    - color: rose
      k: ③
      t: 구현이 다를 정황
      t_style: name
      bullets:
      - 재현의 RCPD는 <span class="em">모든 행에서 총 비용 &gt; 추론 토큰</span>
      - 중간 답을 생성했다는 뜻인데, 발표된 RCPD는 이미 계산된 분포에서 순위만 읽는다
      bullet_size: sm
      style: column
- caption:
    text: |-
      * ③이 사실이라면 재현된 것은 RCPD가 아니라 <b>그 비슷한 다른 방법</b>이다. 논문은 자기 RCPD 구현을 설명하지 않는다.<br>
      * 좁혀도 남는 결론 — <b>이 계열에서 주장된 동작점 그대로 밖에서 재현된 기법이 아직 하나도 없다.</b>
    style: fn
cite:
- hosseini2026
foot: Part 4
