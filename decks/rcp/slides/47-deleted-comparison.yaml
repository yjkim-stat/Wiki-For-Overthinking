# 47 — 삭제된 비교
layout: content
eyebrow: Provenance
eyebrow_color: rose
title: 프리프린트에 있고 게재본에 없는 행
blocks:
- lead: 같은 논문의 두 판본을 나란히 놓으면 표 한 줄이 사라져 있다.
- box:
    style: flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:4px 0;
    blocks:
    - box:
        style: position:relative;line-height:0;overflow:hidden;border-radius:6px;
        blocks:
        - image:
            src: rcp-table1-qwen8b.png
            alt: arXiv v2 Table 1의 Qwen3-8B 블록, 점선 아래 S-GRPO 행
            style: display:block;max-height:320px;width:auto;
        - html: '<div style="position:absolute;left:0.5%;top:88.6%;width:99%;height:9%;border:3px solid var(--violet);border-radius:4px;box-shadow:0 0 0 9999px rgba(255,255,255,.74);"></div>'
- caption:
    text: |-
      * arXiv v2 본문은 결과를 인정한다 — “GPQA-Diamond에서는 이기지만 AIME24에서는 진다.” 실제로 GPQA-Diamond에서는 64.65 대 55.40으로 뒤집힌다.<br>
      * 게재본에서는 <b>표의 행, 이 문장, 베이스라인 목록</b>에서 S-GRPO가 모두 빠졌다. 문자열 등장 횟수 8회 → 1회(관련 연구 절뿐).<br>
      * S-GRPO는 강화학습으로 조기 정지를 학습시키는, <b>훈련이 필요한</b> 방법이고, 추론 시점 비교에서 빼는 것은 방어 가능한 편집 결정이다. 동기를 추정하지 않되 결과는 적는다 — <b>게재본만 읽은 평가는 RCPD의 위치를 과대평가한다.</b>
    style: fn
