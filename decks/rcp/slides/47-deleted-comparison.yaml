- lead: 같은 논문의 두 판본을 나란히 놓으면 표 한 줄이 사라져 있다.
- table:
    head: [Qwen3-8B · AIME24, 추론 토큰, 정확도 (%)]
    rows:
    - ['RCPD', '9,958 <span class="ref">(65%)</span>', '72.22']
    - ['<span class="em">S-GRPO</span> <span class="ref">— arXiv v2에만 있음</span>', '<span class="k-green">8,810</span> <span class="ref">(57%)</span>', '<span class="k-green">77.30</span>']
- caption:
    text: |-
      * arXiv v2 본문은 결과를 인정한다 — “GPQA-D에서는 이기지만 AIME24에서는 진다.” 실제로 GPQA-D에서는 64.65 대 55.40으로 뒤집힌다.<br>
      * 게재본에서는 <b>표의 행, 이 문장, 베이스라인 목록</b>에서 S-GRPO가 모두 빠졌다. 문자열 등장 횟수 8회 → 1회(관련 연구 절뿐).<br>
      * S-GRPO는 <b>훈련이 필요한</b> 방법이고, 추론 시점 비교에서 빼는 것은 방어 가능한 편집 결정이다. 동기를 추정하지 않되 결과는 적는다 — <b>게재본만 읽은 평가는 RCPD의 위치를 과대평가한다.</b>
