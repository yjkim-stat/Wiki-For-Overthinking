    alt: 31개 압축 프롬프트가 하나의 Pareto frontier 위에 놓이고 그 위에 Oracle Upper Bound가 있음
    caption: |-
      Lee 외 (2025) Figure 1의 GPT-4o 패널 · <b>벤치마크</b> MMLU-Pro Math. 점 하나가 압축 프롬프트 하나 · <b>빨간 점선</b>이 실제 달성된 Pareto frontier · <b>분홍 실선</b>이 문항별 최소 길이에서 유도한 Oracle Upper Bound.
