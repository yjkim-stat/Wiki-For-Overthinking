    text: |-
      * 두 선 사이의 <b>세로 간격</b>이 남은 여지다. GPT-4o에서 가장 좋은 프롬프트가 415토큰인데 하한은 121토큰 — <b>1.41배 줄인 자리에서 4.83배가 가능</b>했다는 뜻이다. GSM8K에서는 약 1.4배 대 10.9–11.2배.
