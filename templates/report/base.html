<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!--
  Self-contained by design: no external stylesheet, font or script. The file
  has to open from disk, from an email attachment and from a USB stick in a
  seminar room with no network.
-->
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --surface: #f6f7f9;
  --border: #e2e5ea;
  --text: #14171c;
  --muted: #5b6472;
  --accent: #2f5cd0;
  --accent-soft: #eaf0ff;
  --code-bg: #f2f3f6;
  --max: 46rem;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c;
    --surface: #1b1f26;
    --border: #2b313b;
    --text: #e6e9ee;
    --muted: #9aa4b2;
    --accent: #8fb0ff;
    --accent-soft: #1d2536;
    --code-bg: #1f242c;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "Noto Sans KR", sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: var(--max); margin: 0 auto; padding: 3rem 1.25rem 6rem; }
header.doc { border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; margin-bottom: 2rem; }
header.doc h1 { font-size: 2rem; line-height: 1.25; margin: 0 0 .5rem; letter-spacing: -.01em; }
header.doc .subtitle { color: var(--muted); font-size: 1.05rem; margin: 0 0 1rem; }
.meta { display: flex; flex-wrap: wrap; gap: .4rem .9rem; font-size: .85rem; color: var(--muted); }
.meta span { white-space: nowrap; }
nav.toc {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 1rem 1.25rem; margin: 0 0 2.5rem;
}
nav.toc h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); margin: 0 0 .6rem; }
nav.toc ol { margin: 0; padding-left: 1.2rem; }
nav.toc li { margin: .2rem 0; }
nav.toc a { color: var(--text); text-decoration: none; }
nav.toc a:hover { color: var(--accent); text-decoration: underline; }
h2 { font-size: 1.4rem; margin: 2.75rem 0 .75rem; line-height: 1.3; scroll-margin-top: 1rem; }
h3 { font-size: 1.12rem; margin: 2rem 0 .5rem; }
h4 { font-size: 1rem; margin: 1.5rem 0 .4rem; color: var(--muted); }
p { margin: 0 0 1rem; }
a { color: var(--accent); }
ul, ol { margin: 0 0 1rem; padding-left: 1.4rem; }
li { margin: .3rem 0; }
blockquote {
  margin: 1.25rem 0; padding: .6rem 1rem; border-left: 3px solid var(--accent);
  background: var(--accent-soft); border-radius: 0 6px 6px 0; color: var(--text);
}
blockquote p:last-child { margin-bottom: 0; }
code { background: var(--code-bg); padding: .12em .38em; border-radius: 4px;
  font: .875em/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: .9rem 1rem; overflow-x: auto; }
pre code { background: none; padding: 0; font-size: .84rem; }
.math { background: var(--accent-soft); border-radius: 4px; padding: .05em .35em;
  font: .92em/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.math-block { display: block; margin: 1rem 0; padding: .75rem 1rem; text-align: center; }
.table-scroll { overflow-x: auto; margin: 0 0 1.25rem; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { border: 1px solid var(--border); padding: .45rem .65rem; text-align: left; vertical-align: top; }
th { background: var(--surface); font-weight: 600; }
hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
img { max-width: 100%; height: auto; }
footer.doc { margin-top: 4rem; padding-top: 1.25rem; border-top: 1px solid var(--border);
  color: var(--muted); font-size: .82rem; }
@media print {
  :root { --bg: #fff; --text: #000; --muted: #444; --border: #bbb; --surface: #fff; }
  .wrap { max-width: none; padding: 0; }
  nav.toc { break-inside: avoid; }
  h2, h3 { break-after: avoid; }
  a { text-decoration: none; color: inherit; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="doc">
    <h1>{{TITLE}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>
    <div class="meta">{{META}}</div>
  </header>
  {{TOC}}
  <main>
{{CONTENT}}
  </main>
  <footer class="doc">{{FOOTER}}</footer>
</div>
<script>
// Wrap wide tables so the page itself never scrolls sideways.
document.querySelectorAll('main table').forEach(function (table) {
  if (table.parentElement.classList.contains('table-scroll')) return;
  var box = document.createElement('div');
  box.className = 'table-scroll';
  table.parentNode.insertBefore(box, table);
  box.appendChild(table);
});
</script>
</body>
</html>
